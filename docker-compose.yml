services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./ts/backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    depends_on:
      - db

  go:
    build: ./go
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    depends_on:
      - redis

  frontend:
    build: ./ts/frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - go

volumes:
  postgres_data:
  redis_data:
